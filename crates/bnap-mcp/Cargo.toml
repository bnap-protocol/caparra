[package]
name = "bnap-mcp"
description = "MCP server that exposes BNAP wallet and payment tools to agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "bnap-mcp"
path = "src/main.rs"

[dependencies]
caparra-wallet.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
rpassword.workspace = true
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
caparra-wallet = { workspace = true, features = ["testkit"] }
rmcp = { workspace = true, features = ["client", "server", "macros", "transport-io"] }
tempfile.workspace = true

[lints]
workspace = true
