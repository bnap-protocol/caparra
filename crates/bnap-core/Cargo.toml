sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
base64 = { workspace = true }

