[package]
name = "e2e"
description = "End-to-end tests across the BNAP plugs; the regtest tests need the regtest feature."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Tests against the Lightning regtest network of devenv/regtest. Without
# this feature they are compiled out, so the normal test job skips them.
regtest = ["dep:bnap-rail-lnd", "dep:tokio"]

[dependencies]
bnap-core = { workspace = true, features = ["test-support"] }
bnap-plug.workspace = true
bnap-rail-fake.workspace = true
bnap-scheme-l402.workspace = true
bnap-scheme-mpp.workspace = true
async-trait.workspace = true
bnap-rail-lnd = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[lints]
workspace = true
