# nginx in front, caparra-gate as the authorizer (front = "auth_request").
# nginx passes only 2xx, 401 and 403 from the subrequest, so the gate
# answers every other status as 401 with the real one in BNAP-Status; the
# named location below gives that status back with the gate's fields.

# The manifest comes from the gate (9.1).
location = /.well-known/bnap {
    proxy_pass http://127.0.0.1:8080;
}

location = /_bnap {
    internal;
    proxy_pass http://127.0.0.1:8080/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Forwarded-Method $request_method;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    # The gate refuses paid requests with content it cannot see.
    proxy_set_header X-Original-Content-Length $content_length;
    proxy_set_header X-Original-Transfer-Encoding $http_transfer_encoding;
}

location /v1/ {
    auth_request /_bnap;
    auth_request_set $bnap_receipt $upstream_http_bnap_receipt;
    auth_request_set $bnap_payment_receipt $upstream_http_payment_receipt;
    auth_request_set $bnap_status $upstream_http_bnap_status;
    auth_request_set $bnap_challenge $upstream_http_www_authenticate;
    auth_request_set $bnap_error $upstream_http_bnap_error;
    auth_request_set $bnap_retry_after $upstream_http_retry_after;
    # The credential is the payment, not the application's (10.2).
    proxy_set_header BNAP-Credential "";
    proxy_set_header BNAP-Context "";
    proxy_set_header BNAP-Fund "";
    add_header BNAP-Receipt $bnap_receipt always;
    add_header Payment-Receipt $bnap_payment_receipt always;
    add_header Cache-Control "private, no-store" always;
    error_page 401 = @bnap_refused;
    proxy_pass http://127.0.0.1:9000;
}

# nginx keeps only the first WWW-Authenticate value of the subrequest;
# clients that need every offer should use the proxy front.
location @bnap_refused {
    add_header WWW-Authenticate $bnap_challenge always;
    add_header BNAP-Error $bnap_error always;
    add_header BNAP-Receipt $bnap_receipt always;
    add_header Retry-After $bnap_retry_after always;
    add_header Cache-Control "private, no-store" always;
    if ($bnap_status = 400) { return 400; }
    if ($bnap_status = 404) { return 404; }
    if ($bnap_status = 409) { return 409; }
    if ($bnap_status = 413) { return 413; }
    if ($bnap_status = 429) { return 429; }
    if ($bnap_status = 503) { return 503; }
    if ($bnap_status = "") { return 401; }
    return 402;
}
