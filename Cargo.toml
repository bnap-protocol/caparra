[workspace]
resolver = "3"
members = ["crates/*"]
# The cargo-fuzz targets need nightly and build on their own.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bnap-protocol/caparra"
authors = ["BNAP contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

# Versions shared by all member crates. A member opts in with
# `name = { workspace = true }` and may add features on top.
[workspace.dependencies]
# Internal crates (path + version, so cargo-deny and crates.io accept them).
bnap-core = { path = "crates/bnap-core", version = "0.0.0" }
bnap-plug = { path = "crates/bnap-plug", version = "0.0.0" }
bnap-carrier-http = { path = "crates/bnap-carrier-http", version = "0.0.0" }
bnap-carrier-mcp = { path = "crates/bnap-carrier-mcp", version = "0.0.0" }
bnap-cli = { path = "crates/bnap-cli", version = "0.0.0" }
bnap-mcp = { path = "crates/bnap-mcp", version = "0.0.0" }
bnap-rail-fake = { path = "crates/bnap-rail-fake", version = "0.0.0" }
bnap-rail-lnd = { path = "crates/bnap-rail-lnd", version = "0.0.0" }
bnap-rail-nwc = { path = "crates/bnap-rail-nwc", version = "0.0.0" }
bnap-rail-phoenixd = { path = "crates/bnap-rail-phoenixd", version = "0.0.0" }
bnap-scheme-dpop = { path = "crates/bnap-scheme-dpop", version = "0.0.0" }
bnap-scheme-l402 = { path = "crates/bnap-scheme-l402", version = "0.0.0" }
bnap-scheme-mpp = { path = "crates/bnap-scheme-mpp", version = "0.0.0" }
bnap-scheme-notes = { path = "crates/bnap-scheme-notes", version = "0.0.0" }
bnap-scheme-webbotauth = { path = "crates/bnap-scheme-webbotauth", version = "0.0.0" }
bnap-signer-file = { path = "crates/bnap-signer-file", version = "0.0.0" }
bnap-signer-process = { path = "crates/bnap-signer-process", version = "0.0.0" }
bnap-store-postgres = { path = "crates/bnap-store-postgres", version = "0.0.0" }
bnap-store-sqlite = { path = "crates/bnap-store-sqlite", version = "0.0.0" }
bnap-store-tests = { path = "crates/bnap-store-tests", version = "0.0.0" }
caparra-gate = { path = "crates/caparra-gate", version = "0.0.0" }
caparra-wallet = { path = "crates/caparra-wallet", version = "0.0.0" }
# Bitcoin, ecash and Lightning. secp256k1 is taken through the `bitcoin`
# re-export (`bitcoin::secp256k1`) so the tree carries a single secp256k1.
cashu = "0.18.1"
bitcoin = { version = "0.32.102", features = ["serde", "rand-std"] }
libmacaroon = "0.3.0"
nwc = "0.44.0"
# Trimmed to the RPCs a rail needs; bnap-rail-lnd turns on lightningrpc and
# tls-aws-lc (the provider reqwest's rustls already brings).
fedimint-tonic-lnd = { version = "0.4.0", default-features = false }
mpp = "0.15.1"
web-bot-auth = "0.7.0"
josekit = "0.10.3"

# Attestation schemes (DPoP, Web Bot Auth): pure-Rust signature checks, no
# OpenSSL. ed25519-dalek stays on the 2.x line that web-bot-auth uses, so the
# tree carries one copy; sfv matches web-bot-auth's structured-field parser.
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
ed25519-dalek = "2.2.0"
sfv = "0.13.0"

# Encoding and crypto helpers
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_json_canonicalizer = "0.4.1"
sha2 = "0.11.1"
hmac = "0.13.0"
hex = "0.4.3"
base64 = "0.23.1"
rand = "0.10.3"
zeroize = "1.9.1"
# Wallet storage at rest (caparra-wallet): argon2id derives the key from a
# passphrase, XChaCha20-Poly1305 seals every record. BIP-39 for the seed.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
chacha20poly1305 = "0.10.1"
bip39 = "2.2.2"

# Async runtime, HTTP and MCP
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
async-trait = "0.1.92"
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
hyper = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "charset"] }
# Named directly only to install the process-wide crypto provider (aws-lc-rs,
# the one reqwest's rustls feature uses) before an LND or NWC connection.
rustls = { version = "0.23.45", default-features = false, features = ["std", "aws_lc_rs"] }
rmcp = "3.5.1"

# Storage
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "postgres", "runtime-tokio", "tls-rustls", "macros", "migrate"] }

# Errors, config, CLI and observability
thiserror = "2.0.21"
anyhow = "1.0.104"
# Passphrase prompts without echo (bnap CLI).
rpassword = "7.4.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
toml = "1.1.8"
url = "2.5.8"
time = "0.3.55"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Testing
proptest = "1.12.0"
tempfile = "3.27.0"

# Keep build output small: the dev box has little free disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The wallet's passphrase KDF (argon2id, 64 MiB) takes seconds unoptimized.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Binary releases with dist (https://opensource.axo.dev/cargo-dist/).
# Written by hand for dist 0.33; `dist init` was not run. Releases are
# owner-gated: .github/workflows/release.yml is a placeholder until the owner
# replaces it with the output of `dist generate --mode ci` and drops "ci"
# from allow-dirty.
[workspace.metadata.dist]
cargo-dist-version = "0.33.0"
ci = "github"
# Exactly these packages ship binaries: caparra-gate, bnap (from bnap-cli)
# and bnap-mcp. Every other member is a library and is never distributed.
packages = ["caparra-gate", "bnap-cli", "bnap-mcp"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
# Installers are off for now. The planned set is ["shell", "homebrew"]; the
# homebrew installer also needs a `tap` repository.
installers = []
install-path = "CARGO_HOME"
github-attestations = true
pr-run-mode = "plan"
# The release workflow is a hand-written placeholder, so dist must not insist
# that it matches the generated one.
allow-dirty = ["ci"]

# The profile dist builds release binaries with.
[profile.dist]
inherits = "release"
lto = "thin"
