# cargo-deny configuration for the Caparra workspace.
# Reference: https://embarkstudios.github.io/cargo-deny/
# Run locally with: cargo deny check

[graph]
# Check every feature combination the workspace can turn on.
all-features = true

[output]
feature-depth = 1

# ------------------------------------------------------------------ advisories
# RustSec vulnerabilities, unsound and unmaintained crates and yanked versions.
[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
# Every ignored advisory needs a reason and, ideally, an expiry date:
# ignore = [{ id = "RUSTSEC-0000-0000", reason = "why it does not apply" }]
ignore = [
  { id = "RUSTSEC-2026-0253", reason = "lru 0.16 via nwc 0.44 (bnap-rail-nwc only); needs a panicking destructor during pop(); tracked in https://github.com/bnap-protocol/caparra/issues/1" },
]

# -------------------------------------------------------------------- licenses
# Every dependency must be available under at least one license below.
# The workspace itself is MIT OR Apache-2.0.
[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
  # Permissive data license of the Mozilla CA root store bundled by
  # webpki-roots, which rustls-based TLS stacks (sqlx, reqwest) can pull in.
  "CDLA-Permissive-2.0",
]
# Licenses allowed for one crate only, each with the reason.
exceptions = [
  # hex_lit is a required dependency of bitcoin (and so of bnap-core). Its
  # MITNFA license is MIT plus a clause against false attribution.
  { crate = "hex_lit", allow = ["MITNFA"] },
  # minicbor is a required dependency of cashu (through ur), which the notes
  # signer uses for BDHKE and DLEQ. BlueOak-1.0.0 is an OSI-approved
  # permissive license (use, change and distribute, keep the notice).
  { crate = "minicbor", allow = ["BlueOak-1.0.0"] },
  # fedimint-tonic-lnd, the LND gRPC client of bnap-rail-lnd (pinned in the
  # workspace dependencies), is MITNFA as well: MIT plus the same clause.
  { crate = "fedimint-tonic-lnd", allow = ["MITNFA"] },
]

[licenses.private]
# Unpublished workspace members (publish = false, such as test harnesses)
# are not license checked.
ignore = true

# ------------------------------------------------------------------------ bans
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  # The tree must carry exactly one secp256k1: it is taken through the
  # bitcoin re-export (bitcoin::secp256k1, via cashu). A second copy means two
  # incompatible key and signature types and twice the audit surface.
  { crate = "secp256k1", deny-multiple-versions = true, reason = "use bitcoin::secp256k1; one secp256k1 per tree" },
  { crate = "secp256k1-sys", deny-multiple-versions = true, reason = "follows secp256k1: one C library per tree" },
]
skip = []
skip-tree = []

[bans.workspace-dependencies]
# Members must take shared dependencies with `dep.workspace = true`.
duplicates = "deny"
include-path-dependencies = true
# Most [workspace.dependencies] are not used yet while the crates are stubs.
# Switch to "deny" once every planned crate has its real dependencies.
unused = "warn"

# --------------------------------------------------------------------- sources
# Only crates.io. A git or alternative registry dependency needs an explicit
# entry here and a reason in the pull request.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
